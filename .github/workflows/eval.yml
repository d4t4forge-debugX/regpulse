name: Evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Judge eval (reads saved results, 0 Gemini calls)
        run: python -m eval.run_eval

      - name: Diff eval (0 Gemini calls)
        run: python -m eval.run_eval --diff
